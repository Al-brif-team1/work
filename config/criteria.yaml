evaluation:
  version: "1"
  description: Criteria for assessing external briefs for the Masterskaya student project format.
  project_types:
    - key: development
      title: Development
      description: Software, web, mobile, backend, API, automation or integration project.
      task_types:
        - product_build
        - prototype
      aliases:
        - разработка
        - web
        - mobile
        - backend
        - api
    - key: design
      title: Design
      description: Interface, service, product, brand or visual communication design project.
      task_types:
        - prototype
        - research
      aliases:
        - дизайн
        - ux
        - ui
        - brand
    - key: analytics
      title: Analytics
      description: Research, data analysis, dashboard, market analysis or product analytics project.
      task_types:
        - research
        - dashboard
      aliases:
        - аналитика
        - bi
        - research
    - key: marketing
      title: Marketing
      description: Marketing, communications, content, positioning or promotion project.
      task_types:
        - research
        - content
      aliases:
        - маркетинг
        - smm
        - promotion
    - key: ai
      title: AI
      description: Applied machine learning, LLM, computer vision, NLP or automation with AI.
      task_types:
        - prototype
        - research
      aliases:
        - ии
        - ai
        - ml
        - llm
    - key: education
      title: Education
      description: Educational product, course, learning materials or methodology project.
      task_types:
        - content
        - prototype
      aliases:
        - образование
        - edtech
    - key: mixed
      title: Mixed
      description: Multidisciplinary project involving several directions.
      task_types:
        - prototype
        - research
      aliases:
        - смешанный проект
        - комплексный проект
  task_types:
    - key: product_build
      title: Product build
      description: Build a usable digital product or product module.
      complexity: medium
      criteria:
        - goal_clarity
        - mvp_feasibility
        - student_fit
    - key: prototype
      title: Prototype
      description: Prepare a working prototype or concept that validates the idea.
      complexity: medium
      criteria:
        - goal_clarity
        - result_clarity
        - mvp_feasibility
    - key: research
      title: Research
      description: Analyze a domain, data, users or market and produce conclusions.
      complexity: low
      criteria:
        - goal_clarity
        - material_readiness
        - result_clarity
    - key: dashboard
      title: Dashboard
      description: Analyze data and produce a dashboard or analytical report.
      complexity: medium
      criteria:
        - material_readiness
        - result_clarity
        - mvp_feasibility
    - key: content
      title: Content
      description: Produce educational, marketing or communication materials.
      complexity: low
      criteria:
        - goal_clarity
        - material_readiness
        - student_fit
  criteria:
    # Eligibility gate. It is evaluated first, before the other criteria.
    # Extend status_signals when a new refusal ground appears.
    # Keep list items free of colons - the YAML reader turns such an item into a mapping.
    - key: request_eligibility
      title: Request eligibility
      description: The brief orders work whose digital result is delivered to the customer, and is not an offer of cooperation, partnership, joint development or use of the platform for the author's own or joint educational activity.
      complexity: high
      allowed_values:
        - met
        - not_met
        - insufficient_information
      decision_thresholds:
        min_score: 0
        max_score: 0
        conditions:
          - the request offers cooperation instead of a project task
          - no digital artefact is delivered to the customer
        description: A request that fails eligibility is rejected, not clarified.
      status_signals:
        - partnership_offer
        - joint_course_offer
        - platform_placement_request
        - advertising_integration
        - expert_or_event_request
        - service_sales_offer
        - staffing_request
        - permanent_maintenance_request
        - no_digital_artefact
        - non_digital_deliverable
        - artefact_for_third_party
    # Second gate. request_eligibility asks whether the brief orders work at all,
    # this one asks whether the Masterskaya takes work on that subject.
    # The topic list itself lives in evaluation.restricted_topics.
    - key: topic_eligibility
      title: Topic eligibility
      description: The subject of the project is not on the list of topics the Masterskaya does not accept - gambling, crypto assets and Web3, or software that breaks the law and platform rules.
      complexity: high
      allowed_values:
        - met
        - not_met
        - insufficient_information
      decision_thresholds:
        min_score: 0
        max_score: 0
        conditions:
          - the subject of the project is on the restricted list
        description: A restricted topic is rejected, not clarified or simplified.
      status_signals:
        - gambling
        - crypto_assets
        - malicious_software
    - key: goal_clarity
      title: Goal clarity
      description: The brief explains the purpose of the project and the problem to solve.
      complexity: low
      allowed_values:
        - met
        - not_met
        - insufficient_information
      decision_thresholds:
        min_score: 0
        max_score: 0
        conditions:
          - goal is absent or vague
        description: Missing goal usually requires clarification.
      status_signals:
        - unclear_goal
        - absent_goal
    - key: result_clarity
      title: Expected result clarity
      description: The customer states what concrete output should be delivered.
      complexity: low
      allowed_values:
        - met
        - not_met
        - insufficient_information
      decision_thresholds:
        min_score: 0
        max_score: 0
        conditions:
          - final product is absent
        description: Missing expected result blocks reliable assessment.
      status_signals:
        - unclear_result
        - absent_result
    - key: material_readiness
      title: Material readiness
      description: The brief names available data, content, API, mockups, links or source materials.
      complexity: medium
      allowed_values:
        - met
        - not_met
        - insufficient_information
      decision_thresholds:
        min_score: 0
        max_score: 0
        conditions:
          - materials or access are unclear
        description: Missing materials often require questions before launch.
      status_signals:
        - missing_data
        - missing_api_access
        - missing_content
    - key: mvp_feasibility
      title: MVP feasibility
      description: The scope can be reduced to a realistic student MVP.
      complexity: high
      allowed_values:
        - met
        - not_met
        - insufficient_information
        - risk_detected
      decision_thresholds:
        min_score: 0
        max_score: 0
        conditions:
          - scope is too broad
        description: A broad scope should lead to SIMPLIFY unless risks are critical.
      status_signals:
        - broad_scope
        - unclear_mvp
        - too_many_features
    - key: student_fit
      title: Student project fit
      description: The project can be done by students without production-grade guarantees or unsafe obligations.
      complexity: high
      allowed_values:
        - met
        - not_met
        - insufficient_information
        - risk_detected
      decision_thresholds:
        min_score: 0
        max_score: 0
        conditions:
          - production responsibility is too high
        description: Critical operational or legal responsibility may make the project unsuitable.
      status_signals:
        - production_critical
        - legal_risk
        - unsafe_domain
  required_fields:
    - key: project_goal
      field_path: project_goal
      title: Project goal
      description: The purpose or problem the project should solve.
      required: true
      customer_field_role: blocking
      allowed_values:
        - explicit
    - key: expected_result
      field_path: expected_result
      title: Expected result
      description: The product, artefact or measurable output expected by the customer.
      required: true
      customer_field_role: blocking
      allowed_values:
        - explicit
    - key: tasks
      field_path: tasks
      title: Key tasks
      description: The main tasks that students are expected to complete.
      required: true
      customer_field_role: blocking
      allowed_values:
        - explicit
    - key: project_direction
      field_path: project_direction
      title: Project direction
      description: One of development, design, analytics, marketing, ai, education or mixed.
      required: true
      customer_field_role: internal
      allowed_values:
        - development
        - design
        - analytics
        - marketing
        - ai
        - education
        - mixed
    - key: materials
      field_path: materials
      title: Available materials
      description: Existing data, mockups, API, content, links or source assets.
      required: false
      customer_field_role: optional
      allowed_values:
        - explicit
    - key: deadlines
      field_path: deadlines
      title: Deadlines
      description: Deadline or timing constraints if they exist.
      required: false
      customer_field_role: optional
      allowed_values:
        - explicit
    - key: integrations
      field_path: integrations
      title: Integrations
      description: External systems or APIs required by the project if they exist.
      required: false
      customer_field_role: optional
      allowed_values:
        - explicit
  decision_thresholds:
    - min_score: 0
      max_score: 0
      conditions:
        - final decision is computed by arbitration rules
      description: LLM assessment is advisory; deterministic arbiter returns final status.
  # Topics the Masterskaya does not take, whatever the quality of the brief.
  # Read twice - by the deterministic matcher in AssessmentStage and by the assessment
  # prompt. Keywords are matched as substrings of normalised text, so give stems
  # without endings. Order matters - the first matching topic wins.
  restricted_topics:
    version: "1"
    description: Topics the Masterskaya does not accept as student projects.
    topics:
      - key: gambling
        title: Азартные игры и ставки
        reason_kind: policy
        customer_reason: Мастерская не берёт проекты, связанные с азартными играми, ставками и лотереями.
        keywords:
          - казино
          - букмекер
          - ставк на спорт
          - тотализатор
          - беттинг
          - лотере
      - key: crypto_assets
        title: Криптовалюты, токены и Web3
        reason_kind: policy
        customer_reason: Мастерская не берёт проекты, связанные с криптовалютами, токенами и Web3-сервисами.
        keywords:
          - криптобирж
          - криптовалют
          - крипто-кошел
          - обмен криптовалют
          - nft
          - defi
          - web3
          - токен
          - p2e
          - play-to-earn
      - key: malicious_software
        title: Противоправное программное обеспечение
        reason_kind: illegal
        customer_reason: Заявка предполагает разработку программного обеспечения, которое нарушает закон и правила площадок, поэтому Мастерская её не рассматривает.
        keywords:
          - чит для
          - читы для
          - взлом аккаунт
          - ddos
          - spyware
          - malware
          - загрузчик вредонос
          - массов рассылк
          - массового спама
          - накрутк
  risk_analysis:
    version: "1"
    description: Risk taxonomy for Masterskaya student projects.
    risk_types:
      # Raised when request_eligibility is not met. Drives the reject_out_of_scope rule.
      - key: out_of_scope_request
        title: Request outside the Masterskaya format
        description: The brief is not a project task for a graduate team. It offers cooperation or partnership, asks to place or co-create a course on the platform, sells services, looks for experts or a single hire, or delivers no digital artefact to the customer.
        severity_hint: critical
        signals:
          - partnership_offer
          - joint_course_offer
          - platform_placement_request
          - advertising_integration
          - expert_or_event_request
          - service_sales_offer
          - staffing_request
          - permanent_maintenance_request
          - no_digital_artefact
          - non_digital_deliverable
          - artefact_for_third_party
        evidence_hints:
          - cooperation offered
          - course on the platform
          - services sold
          - experts or speakers wanted
          - one hire or permanent support
          - no digital deliverable
          - result for a third party
      # Raised when topic_eligibility is not met. Drives the reject_restricted_topic rule.
      # Set both by the deterministic matcher in AssessmentStage and by the assessment prompt.
      - key: restricted_topic
        title: Subject the Masterskaya does not take
        description: The project is about gambling and betting, crypto assets, tokens or Web3, or software that breaks the law and platform rules. Such briefs are refused whatever their quality.
        severity_hint: critical
        signals:
          - gambling
          - crypto_assets
          - malicious_software
        evidence_hints:
          - casino or betting platform
          - crypto exchange or token wallet
          - cheats or account cracking
          - mass spam or follower fraud
      - key: missing_materials
        title: Missing materials or access
        description: Required data, content, mockups, API access or links are absent or uncertain.
        severity_hint: medium
        signals:
          - missing_data
          - missing_api_access
          - missing_content
        evidence_hints:
          - no data described
          - access not confirmed
      - key: scope_too_large
        title: Scope too large
        description: The brief asks for too many functions or an industrial-scale product.
        severity_hint: high
        signals:
          - broad_scope
          - too_many_features
          - unclear_mvp
        evidence_hints:
          - many modules
          - full platform
      - key: mentor_expertise_required
        title: Mentor expertise required
        description: The project needs domain, technical, legal or methodological review before launch.
        severity_hint: medium
        signals:
          - complex_domain
          - specialized_expertise
          - legal_risk
        evidence_hints:
          - regulated domain
          - unclear technical feasibility
      - key: production_criticality
        title: Production criticality
        description: The customer expects production-grade reliability, security or operational responsibility. This covers work where a defect harms people or breaks a regulated service - a high-risk medical device, air traffic control, or a state platform with a round-the-clock SLA. Judge the responsibility the result carries, not the industry - an analytics dashboard for a clinic is an ordinary project.
        severity_hint: critical
        signals:
          - production_critical
          - sensitive_data
          - uptime_required
        evidence_hints:
          - real users depend on system
          - personal data
          - critical operations
          - medical device or diagnosis
          - air traffic or transport control
          - round-the-clock SLA obligation
    decision_thresholds:
      - min_score: 0
        max_score: 0
        conditions:
          - critical risks should reject or escalate
        description: Final status is selected by arbitration.
  arbitration:
    version: "1"
    description: Deterministic rules for final brief recommendation.
    default_status: MENTOR_REVIEW
    rules:
      - key: reject_by_business_risk
        title: Reject by business risk
        description: Reject when the brief has a concrete risk type that the Masterskaya does not accept.
        status: REJECT
        confidence: 1.0
        conditions:
          - field: risk.types
            operator: any_in
            value:
              - restricted_topic
              - out_of_scope_request
              - production_criticality
      - key: clarify_blocking_missing_information
        title: Clarify blocking missing information
        description: Ask for clarification when blocking customer-facing information is missing.
        status: CLARIFY
        confidence: 0.85
        conditions:
          - field: completeness.blocking_missing_count
            operator: gt
            value: 0
      - key: clarify_blocking_uncertainty
        title: Clarify blocking uncertainty
        description: Ask for clarification when blocking customer-facing information is uncertain.
        status: CLARIFY
        confidence: 0.85
        conditions:
          - field: completeness.blocking_clarification_count
            operator: gt
            value: 0
      - key: simplify_scope_too_large
        title: Simplify scope too large
        description: Simplify when the project scope is too large for a student MVP.
        status: SIMPLIFY
        confidence: 0.9
        conditions:
          - field: risk.types
            operator: any_in
            value:
              - scope_too_large
      - key: mentor_review_expertise_required
        title: Mentor review expertise required
        description: Send to mentor review when the project requires specialist expertise before launch.
        status: MENTOR_REVIEW
        confidence: 0.8
        conditions:
          - field: risk.types
            operator: any_in
            value:
              - mentor_expertise_required
      - key: mentor_review_unknown_risk_type
        title: Mentor review unknown risk type
        description: Send to mentor review when assessment returns a risk type absent from configured risk taxonomy.
        status: MENTOR_REVIEW
        confidence: 0.75
        conditions:
          - field: risk.unknown_type_count
            operator: gt
            value: 0
      - key: accept_with_missing_optional_information
        title: Accept with missing optional information
        description: Accept the brief while asking for optional customer-facing information that is missing.
        status: ACCEPT_WITH_CLARIFICATIONS
        confidence: 0.9
        conditions:
          - field: completeness.optional_missing_count
            operator: gt
            value: 0
      - key: accept_with_optional_uncertainty
        title: Accept with optional uncertainty
        description: Accept the brief while asking for optional customer-facing information that is uncertain.
        status: ACCEPT_WITH_CLARIFICATIONS
        confidence: 0.9
        conditions:
          - field: completeness.optional_clarification_count
            operator: gt
            value: 0
      - key: accept_ready
        title: Accept ready brief
        description: Accept when no higher-priority rule matched and no customer-facing clarification remains.
        status: ACCEPT
        confidence: 0.95
        conditions:
          - field: completeness.blocking_missing_count
            operator: eq
            value: 0
          - field: completeness.blocking_clarification_count
            operator: eq
            value: 0
          - field: completeness.optional_missing_count
            operator: eq
            value: 0
          - field: completeness.optional_clarification_count
            operator: eq
            value: 0
