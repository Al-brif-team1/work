reject_letters:
  version: "1"
  description: Тексты писем заказчику под основание отказа.

  # Основание отказа опознается по типу риска. Порядок оснований задан в коде
  # (ResponseWriterStage._REJECT_GROUND_PRIORITY) и правкой этого файла не меняется:
  # здесь живут только формулировки.
  grounds:
    # Здесь объяснять нечего: заявка отклонена не из-за качества брифа. Поэтому письмо
    # состоит из одной фразы - без блока оснований, который читается как чек-лист
    # «чего не хватило», и без приглашения переписать бриф.
    - key: restricted_topic
      letter: |-
        Здравствуйте!

        Спасибо за бриф. Проект относится к направлению, с которым Мастерская Яндекс Практикума не работает.

    - key: out_of_scope_request
      letter: |-
        Здравствуйте!

        Спасибо за бриф. Запрос относится к формату, которого нет среди поддерживаемых проектных направлений.

    # Своя причина в начале концовки. Приглашение переписать бриф при этом остается:
    # снизить цену ошибки реально, в отличие от запрещенной темы и чужого формата.
    - key: production_criticality
      closing_prefix: |-
        Ответственность за результат здесь выше той, что можно доверить студенческой команде.

  # Концовка обычного отказного письма: она же используется, когда основание отказа
  # не опознано (например, отказ по красному светофору).
  default_closing: |-
    Если вы готовы существенно изменить постановку задачи, можно подготовить новый бриф с более ограниченным и учебно реализуемым объёмом.
